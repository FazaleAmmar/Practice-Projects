<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/output.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>X(Twitter).com</title>
  </head>
  <body class="bg-black text-white">
    <div class="container flex mx-auto">
      <div class="first w-[70%]">
        <div class="logo">
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            class="invert m-auto w-8 r-4qtqp9 r-yyyyoo r-dnmrzs r-bnwqim r-lrvibr r-m6rgpd r-lrsllp r-1nao33i r-16y2uox r-8kz0gk"
          >
            <g>
              <path
                d="M21.742 21.75l-7.563-11.179 7.056-8.321h-2.456l-5.691 6.714-4.54-6.714H2.359l7.29 10.776L2.25 21.75h2.456l6.035-7.118 4.818 7.118h6.191-.008zM7.739 3.818L18.81 20.182h-2.447L5.29 3.818h2.447z"
              ></path>
            </g>
          </svg>
        </div>

        <div class="sideBar flex justify-end relative h-screen">
          <ul class="flex flex-col text-xl space-y-7 space-x-7 mt-5">
            <li class="flex justify-start items-center gap-1">
              <span class="material-symbols-outlined"> home </span>Home
            </li>
            <li class="flex justify-start items-cente gap-1">
              <span class="material-symbols-outlined"> search </span>Search
            </li>
            <li class="flex justify-start items-center gap-1">
              <span class="material-symbols-outlined"> notifications </span
              >Notifications
            </li>
            <li class="flex justify-start items-center gap-1">
              <span class="material-symbols-outlined"> mail </span>Mail
            </li>
            <li class="flex justify-start items-center gap-1">
              <svg
                class="invert"
                xmlns="http://www.w3.org/2000/svg"
                x="0px"
                y="0px"
                width="26"
                height="26"
                viewBox="0 0 48 48"
              >
                <path
                  d="M18.542 30.532l15.956-11.776c.783-.576 1.902-.354 2.274.545 1.962 4.728 1.084 10.411-2.819 14.315-3.903 3.901-9.333 4.756-14.299 2.808l-5.423 2.511c7.778 5.315 17.224 4 23.125-1.903 4.682-4.679 6.131-11.058 4.775-16.812l.011.011c-1.966-8.452.482-11.829 5.501-18.735C47.759 1.332 47.88 1.166 48 1l-6.602 6.599V7.577l-22.86 22.958M15.248 33.392c-5.582-5.329-4.619-13.579.142-18.339 3.521-3.522 9.294-4.958 14.331-2.847l5.412-2.497c-.974-.704-2.224-1.46-3.659-1.994-6.478-2.666-14.238-1.34-19.505 3.922C6.904 16.701 5.31 24.488 8.045 31.133c2.044 4.965-1.307 8.48-4.682 12.023C2.164 44.411.967 45.67 0 47l15.241-13.608"
                ></path></svg
              >Grok
            </li>
            <li class="flex justify-start items-center gap-1">
              <i class="fa-solid fa-user"></i>Profile
            </li>
            <li class="flex justify-start items-center gap-1">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="white"
                viewBox="0 0 24 24"
              >
                <circle
                  cx="12"
                  cy="12"
                  r="11"
                  stroke="white"
                  stroke-width="2"
                  fill="none"
                />
                <circle cx="9" cy="12" r="1.5" fill="white" />
                <circle cx="12" cy="12" r="1.5" fill="white" />
                <circle cx="15" cy="12" r="1.5" fill="white" />
              </svg>
              Menu
            </li>
            <li class="flex justify-start items-center gap-1">
              <span class="material-symbols-outlined"> add_circle </span>Create
            </li>
            <button class="bg-blue-600 w-28 p-2 rounded-xl outline-0">
              Post
            </button>
          </ul>
          <div
            class="id absolute bottom-1 right-1 w-50 flex cursor-pointer gap-1"
          >
            <div class="profile">
              <img
                src="images/profile.jpg"
                alt="Profile_Ammar"
                class="w-10 rounded-[50%]"
              />
            </div>
            <div class="nameContainer">
              <div class="name flex gap-5 items-center justify-between">
                Fazal e Ammar
                <i class="fa-solid fa-ellipsis"></i>
              </div>
              <div class="userName text-sm text-gray-500">@fazal_e_ammar</div>
            </div>
          </div>
        </div>
      </div>
      <div class="second w-full border-gray-500 border border-y-black">
        Main Content
      </div>
      <div class="third w-full">Suggestions</div>
    </div>
  </body>
</html>
